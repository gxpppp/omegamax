[project]
name = "omigamax"
version = "0.1.0"
description = "omigamax: a from-scratch AlphaGo Zero Go engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "numpy",
    "pygame>=2.6.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "torch==2.13.0+cu130",
]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu130"]

[tool.uv.build-backend]
module-name = "omigamax"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13", "cmake>=3.15", "ninja"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.source-dir = "cpp"
wheel.packages = ["omigamax", "cpp/omigamax_core.pyi"]
