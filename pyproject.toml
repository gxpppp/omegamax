[project]
name = "betamaster"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame>=2.6.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "torch==2.13.0+cu130",
]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu130"]

[project.scripts]
betamaster = "betamaster:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
